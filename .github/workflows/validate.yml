name: Validate Bang1 source
on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  syntax:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: PHP syntax
        run: find run -type f -name '*.php' -print0 | xargs -0 -n1 php -l
      - name: Live fixture grouping regression
        run: php .github/scripts/test_live_groups.php
      - name: Verified athlete photo comparison regression
        run: php .github/scripts/test_runner_photo_review.php
      - name: Drive upload diagnostic regression
        run: php .github/scripts/test_drive_bridge_errors.php
      - name: Historical champion persistence and official final selection
        run: php .github/scripts/test_champion_history.php
      - name: Olympic podium and relay portrait regression
        run: node .github/scripts/test_breaking_podium.js
      - name: JavaScript syntax
        run: |
          find run -type f -name '*.js' -print0 | xargs -0 -n1 node --check
          python3 - <<'PY'
          from pathlib import Path
          import re, subprocess, tempfile
          html=Path('run/legacy-app.html').read_text(encoding='utf-8')
          scripts=re.findall(r'<script(?:\\s[^>]*)?>(.*?)</script>',html,re.S|re.I)
          for i,script in enumerate(scripts):
              if not script.strip(): continue
              with tempfile.NamedTemporaryFile(suffix='.js',mode='w+',encoding='utf-8') as f:
                  f.write(script);f.flush()
                  subprocess.run(['node','--check',f.name],check=True)
          print(f'Validated {len(scripts)} original inline scripts')
          PY
      - name: Check public repository for accidentally committed sensitive files
        shell: bash
        run: |
          if find . -path './.git' -prune -o -type f \
            \( -name '*.xlsx' -o -name '*.xls' -o -name '*.json.gz' -o -name '*.sql.gz' -o -name '*.env' \) -print | grep -q .; then
            echo '::error::Sensitive data or environment file found in public repository'
            exit 1
          fi
