<!doctype html>
<html lang="th"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>นำเข้าข้อมูลส่วนตัว — ระบบกรีฑาบางละมุง 1</title><style>body{font:16px system-ui,sans-serif;background:#071323;color:#e2e8f0;max-width:680px;margin:40px auto;padding:20px}main{background:#0f172a;border:1px solid #334155;border-radius:16px;padding:24px}input{display:block;box-sizing:border-box;width:100%;padding:12px;margin:10px 0 20px;background:#020617;color:#fff;border:1px solid #475569;border-radius:8px}button{background:#22c55e;color:#064e3b;border:0;border-radius:8px;padding:12px 20px;font-weight:bold;cursor:pointer}.warn{color:#fbbf24}#output{white-space:pre-wrap;overflow-wrap:anywhere}</style></head><body>
<main><h1>นำเข้า Excel ไป MariaDB</h1>
<p>นำเข้าข้อมูลชุดเดิมจากไฟล์ <code>bang1_private_import.json.gz</code> โดยตรงเข้าสู่ฐานข้อมูลส่วนตัวของ Host</p>
<p class="warn">ไฟล์มีข้อมูลนักเรียนและข้อมูลส่วนบุคคล ห้ามอัปโหลดไป GitHub สาธารณะ</p>
<form id="form">
<label>DEPLOY_TOKEN (คีย์ส่วนตัว ไม่จัดเก็บในเบราว์เซอร์)
<input id="token" type="password" autocomplete="off" required placeholder="กรอกโทเค็นเดียวกับ GitHub Secret DEPLOY_TOKEN"></label>
<label>ไฟล์นำเข้า JSONL gzip
<input id="data" type="file" accept=".gz,application/gzip" required></label>
<button type="submit">นำเข้าข้อมูลไป MariaDB</button>
</form><p id="output" role="status"></p>
</main><script>
'use strict';
const resultEl=document.getElementById('output');
const form=document.getElementById('form');
form.addEventListener('submit',async event=>{
  event.preventDefault();
  const btn=form.querySelector('button[type="submit"]');
  const token=document.getElementById('token').value.trim();
  const file=document.getElementById('data').files[0];
  if(!token||!file)return;
  btn.disabled=true;
  let processed=0,warnings=0;
  try{
    const canChunk=typeof DecompressionStream==='function'&&typeof CompressionStream==='function';
    const files=[];
    if(canChunk) {
      const text=await new Response(file.stream().pipeThrough(new DecompressionStream('gzip'))).text();
      const lines=text.split(/\r?\n/).filter(s=>s.trim().length>0);
      if(!lines.length)throw Error('ไฟล์ไม่มีข้อมูลนำเข้า');
      // Splitting protects small shared-host PHP workers from timeouts on 7,000+ records.
      const chunkSize=400;
      for(let i=0;i<lines.length;i+=chunkSize)files.push(lines.slice(i,i+chunkSize).join('\n')+'\n');
    } else {
      files.push(file);
    }
    resultEl.textContent='ตรวจสอบไฟล์แล้ว เริ่มนำเข้าข้อมูล ...';
    for(let i=0;i<files.length;i++){
      let uploadFile=files[i];
      if(typeof uploadFile==='string'){
        const stream=new Blob([uploadFile],{type:'application/x-ndjson'}).stream().pipeThrough(new CompressionStream('gzip'));
        uploadFile=await new Response(stream).blob();
      }
      const body=new FormData();
      body.append('data',uploadFile,'bang1_private_import_part_'+(i+1)+'.json.gz');
      const response=await fetch('import.php',{method:'POST',headers:{'X-Deploy-Token':token},body,credentials:'same-origin'});
      let r;try{r=await response.json()}catch{throw Error('เซิร์ฟเวอร์ไม่ส่งผลลัพธ์ JSON (HTTP '+response.status+')')}
      if(!response.ok||!r.success)throw Error('ชุดที่ '+(i+1)+' : '+(r.message||'เกิดข้อผิดพลาด'));
      processed+=Number(r.imported_rows||0);warnings+=Number(r.formula_warning_rows||0);
      resultEl.textContent='กำลังนำเข้า '+(i+1)+'/'+files.length+' ชุด | '+processed+' แถว';
    }
    resultEl.textContent='นำเข้าสำเร็จ '+processed+' แถว\nรายการที่พบข้อผิดพลาดสูตร '+warnings+' แถว\nตรวจสอบหน้าเว็บและจำนวนข้อมูลใน MariaDB ก่อนใช้งานจริง';
  }catch(err){
    resultEl.textContent='นำเข้าสะดุดหลัง '+processed+' แถว: '+err.message+'\nสามารถลองนำเข้าไฟล์เดิมซ้ำได้โดยใช้โทเค็นเดิม (ระบบปรับปรุงแถวตามรหัส)';
  }finally{
    btn.disabled=false;
    document.getElementById('token').value='';
  }
});
</script></body></html>
